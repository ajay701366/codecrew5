services:
  postgres:
    image: postgres:16
    container_name: brandguard-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: brandguard
      POSTGRES_PASSWORD: brandguard123
      POSTGRES_DB: brandguard

    ports:
      - "5432:5432"

    volumes:
      - brandguard_postgres_data:/var/lib/postgresql/data

volumes:
  brandguard_postgres_data:
